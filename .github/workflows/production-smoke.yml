name: Production smoke check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://aeterna-vault-zawj.onrender.com/api/health)"
          echo "$response"
          node -e 'const value=JSON.parse(process.argv[1]); if(!value.ok || !value.databaseConnected) process.exit(1)' "$response"
