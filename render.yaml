services:
  - type: web
    name: aeterna-vault
    runtime: node
    plan: starter
    repo: https://github.com/Honfishlab/aeterna-vault.git
    branch: main
    buildCommand: npm install --no-audit --no-fund && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start -- --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aeterna-vault-db
          property: connectionString
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: APP_BASE_URL
        value: https://aeterna-vault-zawj.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MEDIA_PROVIDER_TOKEN_KEY
        sync: false
      - key: IMPORT_WORKER_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: IMPORT_EMAIL_NOTIFICATIONS
        value: "false"

  - type: worker
    name: aeterna-vault-import-worker
    runtime: node
    plan: starter
    repo: https://github.com/Honfishlab/aeterna-vault.git
    branch: main
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/import-worker.mjs
    envVars:
      - key: APP_BASE_URL
        value: https://aeterna-vault-zawj.onrender.com
      - key: IMPORT_WORKER_SECRET
        sync: false

databases:
  - name: aeterna-vault-db
    plan: basic-256mb
    databaseName: aeterna_vault
    user: aeterna_vault
    ipAllowList: []
