services:
  - type: web
    name: aeterna-vault
    runtime: node
    plan: starter
    repo: https://github.com/Honfishlab/aeterna-vault.git
    branch: main
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start -- --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aeterna-vault-db
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: aeterna-vault-db
    plan: basic-256mb
    databaseName: aeterna_vault
    user: aeterna_vault
    ipAllowList: []
